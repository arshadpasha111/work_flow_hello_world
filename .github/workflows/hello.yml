name: First GitHub Action

on:
  push:
    branches:
      - main

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Say Hello
        run: echo "Hello from my first GitHub Action!"

      - name: Show files
        run: ls -la

      - name: Display hello.txt
        run: cat hello.txt
